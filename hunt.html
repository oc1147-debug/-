<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>狩猟クエスト 3D</title>
<style>
:root{--hud:rgba(10,6,4,.72);--ink:#f4e8cc;--gold:#e0b858;--red:#e0495a;--grn:#4bc46a;--yel:#e6c34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#1a120d;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;pointer-events:none;padding:8px 12px}
#top{top:env(safe-area-inset-top,0px)}#bot{bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-between;align-items:flex-end}
.bar{height:12px;background:var(--hud);border:1px solid #fff5;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%}
#mname{font-weight:800;font-size:14px;margin-bottom:3px;display:flex;justify-content:space-between;text-shadow:0 1px 3px #000}
.me{width:min(46vw,220px)}.me .bar{margin-top:5px}
.btns{pointer-events:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.btns button:active{filter:brightness(1.3)}
#atk{width:104px;padding:20px 0}
#ring{position:fixed;width:90px;height:90px;border:2px solid #fff7;border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:29px;top:29px;width:32px;height:32px;border-radius:50%;background:#fff6}
#ov{position:fixed;inset:0;background:rgba(10,6,4,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#ov h1{margin:0;font-size:36px;letter-spacing:.1em}#ov p{margin:0;font-size:15px;line-height:1.8;max-width:420px}
.q{background:var(--gold);color:#120708;border:0;border-radius:6px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;display:block;width:min(88vw,380px);margin:5px auto}.q small{display:block;font-weight:500;font-size:12px}
#pbars{display:flex;gap:8px;margin-top:5px;font-size:11px;text-shadow:0 1px 3px #000}#pbars>div{flex:1}#pbars .bar{height:6px;margin-top:2px}
#note{position:fixed;top:28%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;color:var(--gold);text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s;pointer-events:none}
#flash{position:fixed;inset:0;background:rgba(200,20,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>

<div class="hud" id="top"><div id="mname"><span id="mn">炎牙竜 ガルディオス</span><span id="tm"></span></div><div class="bar"><i id="mb" style="background:#d98a2b"></i></div><div id="pbars"><div>頭<div class="bar"><i id="pH" style="background:#c46"></i></div></div><div>尻尾<div class="bar"><i id="pT" style="background:#c46"></i></div></div><div>脚<div class="bar"><i id="pL" style="background:#c46"></i></div></div></div></div>
<div class="hud" id="bot">
  <div class="me"><div class="bar"><i id="hb" style="background:var(--grn)"></i></div><div class="bar" style="height:7px"><i id="sb" style="background:var(--yel)"></i></div></div>
  <div class="btns"><button id="bl" style="background:#2fa8b8;padding:10px 0">飛翔斬</button><button id="bp">回復薬 ×3</button><button id="bc" style="background:var(--gold)">見切り</button><button id="br">回避</button><button id="atk">攻撃</button></div>
</div>
<div id="ring"><div id="knob"></div></div>
<div id="ov"><h1 id="ot">狩猟クエスト</h1><p id="od">太刀を手に、モンスターを制限時間4分で討伐せよ。<br>赤い範囲は攻撃の予告。回避、または納刀（U）で攻撃を引きつけ、当たる瞬間にもう一度Uで居合カウンター！<br>飛翔斬（R）は居合カウンター成功時に1回だけ使える必殺技。敵へ突進し、当たると跳び上がって空中から大斬り！ジャンプ中は敵の地上攻撃をかわせる。<br>頭・尻尾・脚を攻め続ければ部位破壊。</p><p style="opacity:.7;font-size:13px">移動 WASD／左スティック　視点 ←→／ドラッグ<br>攻撃 J・Space　回避 K・Shift　回復 L・E　飛翔斬 R（居合成功時のみ）　納刀 U・C（納刀中にもう一度で居合）</p><div id="qs"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z),ang=(a,b)=>Math.atan2(b.z-a.z,b.x-a.x);
const adiff=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
const R=26; // アリーナ半径
// ---- シーン ----
const ren=new T.WebGLRenderer({canvas:$("c"),antialias:true});ren.setPixelRatio(Math.min(2,devicePixelRatio));
const sc=new T.Scene();sc.background=new T.Color(0xa9c0cc);sc.fog=new T.Fog(0xdcd2ae,40,95);
const cam=new T.PerspectiveCamera(60,1,.1,200);
sc.add(new T.HemisphereLight(0xffffff,0x6b5a3a,.85));
const sun=new T.DirectionalLight(0xffe2b0,1.05);sun.position.set(20,30,10);sc.add(sun);
// ---- 空・太陽エフェクト（白熱コア＋放射光条＋暖色グロー） ----
const skyC=document.createElement("canvas");skyC.width=2;skyC.height=256;const skyG=skyC.getContext("2d");
const sgr=skyG.createLinearGradient(0,0,0,256);sgr.addColorStop(0,"#5f88ad");sgr.addColorStop(.45,"#a9c0cc");sgr.addColorStop(.72,"#ead9ac");sgr.addColorStop(1,"#e0b070");
skyG.fillStyle=sgr;skyG.fillRect(0,0,2,256);
const skyD=new T.Mesh(new T.SphereGeometry(110,24,16),new T.MeshBasicMaterial({map:new T.CanvasTexture(skyC),side:T.BackSide,fog:false,depthWrite:false}));skyD.renderOrder=-2;sc.add(skyD);
function sunTexDraw(fn){const c=document.createElement("canvas");c.width=c.height=256;fn(c.getContext("2d"));return new T.CanvasTexture(c)}
const glowT=sunTexDraw(g=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.16,"rgba(255,246,210,.95)");r.addColorStop(.38,"rgba(255,196,84,.6)");r.addColorStop(.68,"rgba(255,128,32,.2)");r.addColorStop(1,"rgba(255,90,20,0)");g.fillStyle=r;g.fillRect(0,0,256,256)});
const rayT=sunTexDraw(g=>{g.translate(128,128);for(let i=0;i<14;i++){const a=i/14*6.283+(i%2?.12:0),L=i%2?58:116;g.strokeStyle=i%2?"rgba(255,238,200,.55)":"rgba(255,255,255,.8)";g.lineWidth=i%2?3:7;g.lineCap="round";g.beginPath();g.moveTo(Math.cos(a)*13,Math.sin(a)*13);g.lineTo(Math.cos(a)*L,Math.sin(a)*L);g.stroke()}});
const SD=new T.Vector3(20,12,10).normalize(),sunGrp=new T.Group();sc.add(sunGrp);
function mkSun(tx,s,o){const m=new T.SpriteMaterial({map:tx,blending:T.AdditiveBlending,depthWrite:false,transparent:true,opacity:o,fog:false});const sp=new T.Sprite(m);sp.scale.setScalar(s);sp.position.copy(SD).multiplyScalar(88);sunGrp.add(sp);return sp}
const sunHalo=mkSun(glowT,95,.3),sunGlow=mkSun(glowT,58,.9),sunRays=mkSun(rayT,46,.55),sunCore=mkSun(glowT,15,1);
// 光の粒（舞い上がる灼熱の火花）
const emberN=52,ePos=new Float32Array(emberN*3),eVel=[];
for(let i=0;i<emberN;i++){ePos[i*3]=(Math.random()*2-1)*(R-2);ePos[i*3+1]=.5+Math.random()*7;ePos[i*3+2]=(Math.random()*2-1)*(R-2);eVel.push(.3+Math.random()*.7)}
const eGeo=new T.BufferGeometry();eGeo.setAttribute("position",new T.BufferAttribute(ePos,3));
const eTex=sunTexDraw(g=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,"rgba(255,224,150,1)");r.addColorStop(.35,"rgba(255,172,64,.55)");r.addColorStop(1,"rgba(255,120,30,0)");g.fillStyle=r;g.fillRect(0,0,256,256)});
const embers=new T.Points(eGeo,new T.PointsMaterial({map:eTex,size:.55,transparent:true,opacity:.65,blending:T.AdditiveBlending,depthWrite:false}));sc.add(embers);
const ground=new T.Mesh(new T.CircleGeometry(R+2,48),new T.MeshLambertMaterial({color:0x8a7a52}));ground.rotation.x=-Math.PI/2;sc.add(ground);
const out=new T.Mesh(new T.RingGeometry(R+2,90,48),new T.MeshLambertMaterial({color:0x4d5e3a}));out.rotation.x=-Math.PI/2;out.position.y=-.02;sc.add(out);
for(let i=0;i<22;i++){const a=i/22*6.283,s=1.5+(i*7%5)*.5;const r=new T.Mesh(new T.DodecahedronGeometry(s),new T.MeshLambertMaterial({color:0x6e665c}));r.position.set(Math.cos(a)*(R+2.5),s*.5,Math.sin(a)*(R+2.5));sc.add(r)}
// ---- プレイヤー ----
const pm=new T.Group(),mat=c=>new T.MeshLambertMaterial({color:c});
const pBody=new T.Mesh(new T.CylinderGeometry(.4,.45,1.3,12),mat(0x4a7fc1));pBody.position.y=.85;pm.add(pBody);
const pHead=new T.Mesh(new T.SphereGeometry(.35,12,12),mat(0xe8c9a0));pHead.position.y=1.8;pm.add(pHead);
const swordG=new T.Group();swordG.position.y=1.2;
// ---- 太刀：反りのある刀身・峰の鋸刃・青緑の発光紋・巻き柄・金の鍔 ----
const bladeM=new T.MeshPhongMaterial({color:0xc9d3dc,specular:0xffffff,shininess:90}),glowM=new T.MeshBasicMaterial({color:0x39f0d8}),goldM=new T.MeshPhongMaterial({color:0xc9a24a,specular:0xffeeaa,shininess:60}),wrapM=new T.MeshLambertMaterial({color:0x3a2350});
const sw=new T.Group();sw.position.x=.3;sw.rotation.x=.25;swordG.add(sw);
const BL=3.3,bY=x=>.2*(x/BL)**2,bW=x=>.17-.07*(x/BL);
const bs=new T.Shape();bs.moveTo(0,bY(0)-bW(0));
for(let i=1;i<=16;i++){const x=BL*i/16;bs.lineTo(x,bY(x)-bW(x))}
bs.lineTo(BL+.15,bY(BL)+.1);
for(let i=16;i>=0;i--){const x=BL*i/16;bs.lineTo(x,bY(x)+bW(x)+((i>=3&&i<=14&&i%2)?.05:0))}
bs.lineTo(0,bY(0)-bW(0));
const bg=new T.ExtrudeGeometry(bs,{depth:.07,bevelEnabled:false});bg.translate(0,0,-.035);
sw.add(new T.Mesh(bg,bladeM));
[.05,-.05].forEach(z=>{const gp=[];for(let i=0;i<=24;i++){const x=.45+(BL-.8)*i/24;gp.push(new T.Vector3(x,bY(x)+Math.sin(i*.9)*.045,z))}
 sw.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(gp),48,.022,5,false),glowM))});
const grip=new T.Mesh(new T.CylinderGeometry(.09,.09,1.3,10),wrapM);grip.rotation.z=Math.PI/2;grip.position.x=-.75;sw.add(grip);
for(let i=0;i<7;i++){const t=new T.Mesh(new T.TorusGeometry(.095,.022,6,12),goldM);t.rotation.y=Math.PI/2;t.position.x=-.25-i*.17;sw.add(t)}
const gd=new T.Mesh(new T.CylinderGeometry(.3,.3,.07,12),goldM);gd.rotation.z=Math.PI/2;sw.add(gd);
const hb=new T.Mesh(new T.CylinderGeometry(.14,.14,.24,10),goldM);hb.rotation.z=Math.PI/2;hb.position.x=.12;sw.add(hb);
[1,-1].forEach(k=>{const c=new T.Mesh(new T.ConeGeometry(.08,.3,6),goldM);c.position.y=k*.38;c.rotation.z=k>0?0:Math.PI;sw.add(c)});
const pom=new T.Mesh(new T.SphereGeometry(.13,10,10),goldM);pom.position.x=-1.45;sw.add(pom);
const gem=new T.Mesh(new T.SphereGeometry(.08,8,8),glowM);gem.position.x=-1.55;sw.add(gem);
// 斬撃の軌跡
const trM=new T.MeshBasicMaterial({color:0x7ffff0,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false});
const trail=new T.Mesh(new T.RingGeometry(1.4,3.8,28,1,0,.9),trM);trail.rotation.x=-Math.PI/2;trail.position.y=1.2;pm.add(trail);
// 背中の鞘
const scb=new T.Mesh(new T.BoxGeometry(3.7,.32,.2),mat(0x4a1a22));scb.position.set(-2.04,1.16,-.35);scb.rotation.z=.5;pm.add(scb);
const streakM=new T.MeshBasicMaterial({color:0x9ffff0,transparent:true,opacity:0,depthWrite:false}),streak=new T.Mesh(new T.BoxGeometry(1,.06,.35),streakM);sc.add(streak);
pm.add(swordG);sc.add(pm);
// ---- モンスター（飛竜型・オリジナル）：鱗テクスチャ・しなる首/尻尾・開閉する顎 ----
function tex(draw,rx,ry){const c=document.createElement("canvas");c.width=c.height=256;draw(c.getContext("2d"));const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);return t}
function bigTex(fn,sz){const c=document.createElement("canvas");c.width=c.height=sz;fn(c.getContext("2d"),sz);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t}
const speck=(g,s,n,a1,a2)=>{for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?`rgba(0,0,0,${a1})`:`rgba(255,255,255,${a2})`;g.fillRect(Math.random()*s,Math.random()*s,1.5,1.5)}};
// 体表：重なり合う鱗＋風化斑＋擦過傷（グレー基調で体色染色に対応）
const scaleTex=bigTex((g,s)=>{g.fillStyle="#cccccc";g.fillRect(0,0,s,s);
 const w=24,h=16;for(let y=0;y<s+h;y+=h)for(let x=-((y/h|0)%2)*w/2;x<s+w;x+=w){const v=196+((x*7+y*13)%3)*13+Math.random()*20;
  const r=g.createRadialGradient(x+w/2,y+2,1,x+w/2,y+2,w*.62);r.addColorStop(0,`rgb(${v+26|0},${v+24|0},${v+20|0})`);r.addColorStop(.72,`rgb(${v|0},${v-4|0},${v-9|0})`);r.addColorStop(1,"rgb(94,92,90)");
  g.fillStyle=r;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.arc(x+w/2,y,w/2,0,Math.PI);g.closePath();g.fill()}
 for(let i=0;i<10;i++){const px=Math.random()*s,py=Math.random()*s,pr=20+Math.random()*45;const rg=g.createRadialGradient(px,py,0,px,py,pr);rg.addColorStop(0,"rgba(30,26,24,.15)");rg.addColorStop(1,"rgba(30,26,24,0)");g.fillStyle=rg;g.beginPath();g.arc(px,py,pr,0,7);g.fill()}
 g.strokeStyle="rgba(70,64,60,.3)";for(let i=0;i<14;i++){g.lineWidth=.8+Math.random();const sx=Math.random()*s,sy=Math.random()*s,a=Math.random()*6.28,L=10+Math.random()*30;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a)*L,sy+Math.sin(a)*L);g.stroke()}
 speck(g,s,1400,.07,.05)},512);
scaleTex.repeat.set(4,2.5);
// 腹部：横じまの柔らかい革皮膚
const bellyTex=bigTex((g,s)=>{g.fillStyle="#e0e0e0";g.fillRect(0,0,s,s);
 for(let y=0;y<s;y+=13){g.strokeStyle="rgba(118,110,102,.4)";g.lineWidth=2+Math.random();g.beginPath();for(let x=0;x<=s;x+=16)g.lineTo(x,y+Math.sin(x/34+y)*2.4);g.stroke()}
 speck(g,s,900,.05,.06)},512);
bellyTex.repeat.set(3,2);
// 翼膜：暗褐色の革＋骨に沿うベージュの放射条＋斑ノイズ
const wingTex=bigTex((g,s)=>{const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,"#56422f");gr.addColorStop(.5,"#3a2b20");gr.addColorStop(1,"#2a1e16");g.fillStyle=gr;g.fillRect(0,0,s,s);
 const root=[.48*s,(1-.78)*s],tips=[[.88,.7],[.84,.367],[.56,.067],[.1,.267],[.35,.5]].map(([u,v])=>[u*s,(1-v)*s]);
 tips.forEach(([tx,ty],i)=>{g.lineCap="round";g.strokeStyle=i<4?"rgba(206,182,138,.8)":"rgba(206,182,138,.4)";g.lineWidth=i<4?22:34;g.beginPath();g.moveTo(root[0],root[1]);g.lineTo(tx,ty);g.stroke();g.strokeStyle="rgba(240,224,188,.45)";g.lineWidth=8;g.stroke()});
 for(let i=0;i<70;i++){const px=Math.random()*s,py=Math.random()*s,pr=6+Math.random()*22;g.fillStyle=Math.random()<.6?"rgba(16,10,6,.18)":"rgba(210,190,150,.08)";g.beginPath();g.arc(px,py,pr,0,7);g.fill()}
 speck(g,s,1200,.08,.04)},512);
const mm=new T.Group(),bodyMat=new T.MeshPhongMaterial({color:0xa8431f,map:scaleTex,bumpMap:scaleTex,bumpScale:.05,shininess:16,specular:0x554433}),bellyM=new T.MeshPhongMaterial({color:0xd8a070,map:bellyTex,bumpMap:bellyTex,bumpScale:.035,shininess:8,specular:0x333028}),wingMat=new T.MeshLambertMaterial({color:0xffffff,map:wingTex,side:T.DoubleSide}),accM=new T.MeshPhongMaterial({color:0x2a1a14,shininess:40}),clawM=new T.MeshPhongMaterial({color:0x191310,shininess:70,specular:0x777777}),horn=new T.MeshPhongMaterial({color:0xf0e0b0,shininess:30}),eyeM=new T.MeshBasicMaterial({color:0xffd24a}),mouthM=new T.MeshBasicMaterial({color:0xff6a1a});
const add=(g,m,x,y,z,par)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(par||mm).add(o);return o};
const bone=(par,a,b,r,m)=>{const d=new T.Vector3().subVectors(b,a),o=new T.Mesh(new T.CylinderGeometry(r*.7,r,d.length(),6),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());par.add(o)};
const body=add(new T.SphereGeometry(1,28,20),bodyMat,0,2.4,0);body.scale.set(2.7,1.5,1.4);
const belly=add(new T.SphereGeometry(1,24,16),bellyM,.1,1.95,0);belly.scale.set(2.5,1.15,1.3);
for(let i=0;i<9;i++){const x=2.1-i*.65;add(new T.ConeGeometry(.17+.03*(i%2),.7+.15*(i%3),6),accM,x,2.4+1.5*Math.sqrt(1-(x/2.7)**2)-.1,0)}
// 胸筋・翼付け根の肩の隆起
[[.7,-.85],[.7,.85]].forEach(([x,z])=>{const c=add(new T.SphereGeometry(.85,16,12),bodyMat,x,2.45,z);c.scale.set(1.15,.72,.9)});
[[.95],[-.95]].forEach(([z])=>add(new T.SphereGeometry(.6,14,10),bodyMat,.8,3.5,z).scale.set(1,.85,.9));

const neckSegs=[];for(let i=0;i<9;i++){const t=i/8,u=1-t,x=u*u*2+2*u*t*3.3+t*t*3.9,y=u*u*2.8+2*u*t*3+t*t*4.2,o=add(new T.SphereGeometry(1,14,10),bodyMat,x,y,0);const r=.85-.4*t;o.scale.set(r*1.3,r,r);o.userData.y0=y;neckSegs.push(o)}
// 眼（スリット瞳・虹彩・ハイライト・まぶた・発光）
const eyeTex=(()=>{const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");
 g.fillStyle="#2a0a04";g.fillRect(0,0,512,256);
 const gr=g.createRadialGradient(256,128,6,256,128,72);gr.addColorStop(0,"#fff4a8");gr.addColorStop(.45,"#ffc21a");gr.addColorStop(.8,"#d2430a");gr.addColorStop(1,"#4a0e02");
 g.fillStyle=gr;g.beginPath();g.arc(256,128,72,0,7);g.fill();
 g.strokeStyle="rgba(90,20,0,.55)";g.lineWidth=1.5;for(let i=0;i<40;i++){const a=i/40*6.283;g.beginPath();g.moveTo(256+Math.cos(a)*20,128+Math.sin(a)*20);g.lineTo(256+Math.cos(a)*70,128+Math.sin(a)*70);g.stroke()}
 g.fillStyle="#000";g.beginPath();g.ellipse(256,128,9,56,0,0,7);g.fill();
